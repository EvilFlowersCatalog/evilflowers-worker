[project]
name = "evilflowers-worker"
version = "0.1.0"
description = "The runtime of EvilFlowers workers: message contract, catalog client, outcome files, Celery delivery semantics, observability"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
# 3.12 (the extraction services, ocr-service) to 3.14 (lcpencrypt-worker); CI runs both ends.
requires-python = ">=3.12"
# No model, layout or PDF dependency: every service can install it.
dependencies = [
    "celery[redis]>=5.6,<6",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "redis>=5",
    "requests>=2.32",
    # The code uses the API only; a no-op without the `otel` extra. One release train with the catalog.
    "opentelemetry-api==1.45.2",
]

[project.optional-dependencies]
# OTLP/HTTP to the node's Alloy; SDK/exporter 1.x and contrib 0.yb0 move together (as in the catalog).
otel = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = [
    "pyroscope-io==1.4.0",
    "pyroscope-otel==1.1.0",
]

[dependency-groups]
# `uv sync` installs the core and this group only; CI adds `--extra otel`.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "pytest-cov>=6",
    "mypy>=1.13",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_worker"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evilflowers_worker.*"]
disallow_untyped_defs = true
